<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenAI API Logger · 控制台</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Cpath d='M8 12h16M8 16.5h11M8 21h7' stroke='white' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-logo" aria-hidden="true">
            <svg viewBox="0 0 32 32" width="26" height="26">
              <rect width="32" height="32" rx="7" fill="#2563eb" />
              <path d="M8 12h16M8 16.5h11M8 21h7" stroke="#fff" stroke-width="2.6" stroke-linecap="round" />
            </svg>
          </div>
          <div class="brand-text">
            <strong>API Logger</strong>
            <span>OpenAI 兼容代理日志</span>
          </div>
        </div>

        <nav id="nav" class="nav"></nav>

        <div class="sidebar-foot">
          <div class="conn" id="conn-status">
            <span class="dot" id="conn-dot"></span>
            <span id="conn-text">连接中…</span>
          </div>
          <div class="version" id="version-text"></div>
        </div>
      </aside>

      <main class="main">
        <header class="topbar" id="topbar"></header>
        <section class="view" id="view"></section>
      </main>
    </div>

    <div class="drawer-mask" id="drawer-mask" hidden></div>
    <aside class="drawer" id="drawer" hidden></aside>
    <div class="modal-mask" id="modal-mask" hidden>
      <div class="modal" id="modal"></div>
    </div>
    <div class="toasts" id="toasts"></div>

    <script type="module" src="/static/app.js"></script>
  </body>
</html>
